```yaml
name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./ElectricityBillFrontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/electricity-bill-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./CrudServiceProject
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/electricity-bill-backend:latest

      - name: Build and push Eureka server
        uses: docker/build-push-action@v6
        with:
          context: ./EurekaService
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/electricity-bill-eureka:latest
```